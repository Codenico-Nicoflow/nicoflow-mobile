name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci's strict lockfile-match fails intermittently on this project's
      # optional wasm deps (@emnapi/*) resolving differently across
      # platforms/npm versions. npm install tolerates that drift.
      - run: npm install

      # expo-env.d.ts is gitignored and normally regenerated by `expo start`;
      # write it directly so type-check works without booting the dev server.
      - run: |
          printf '/// <reference types="expo/types" />\n' > expo-env.d.ts

      # .expo/types/router.d.ts (typed routes) is also gitignored and normally
      # written by `expo start`. Without it Href degrades to plain string and
      # a typo'd route silently type-checks green in CI while erroring locally.
      # This is the documented no-dev-server way to generate it. It also
      # rewrites tsconfig.json (already committed in its generated form), so
      # fail loudly if that write actually changes something rather than
      # type-checking against a config nobody reviewed.
      - run: npx expo customize tsconfig.json

      - run: git diff --exit-code tsconfig.json

      - run: npm run lint

      - run: npm run type-check

      - run: npm test
