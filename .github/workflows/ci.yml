name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # expo-env.d.ts is gitignored and normally regenerated by `expo start`;
      # write it directly so type-check works without booting the dev server.
      - run: |
          printf '/// <reference types="expo/types" />\n' > expo-env.d.ts

      - run: npm run lint

      - run: npm run type-check

      - run: npm test
